name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.module }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        module: ['signer', 'validator']
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            signer/go.sum
            validator/go.sum
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 -timeout=10m ./...

  packages:
    name: Build and exercise release packages
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            signer/go.sum
            validator/go.sum
      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Check packaging scripts
        run: shellcheck -s sh packaging/*.sh scripts/*.sh
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.1
          args: check
      - name: Build every release target and unsigned package
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.1
          args: release --snapshot --clean
      - name: Verify third-party notices against every release binary
        run: python3 scripts/update-notices.py --check
      - name: Install, reinstall, and remove packages in Debian and Fedora
        run: sh scripts/test-packages.sh
      - name: Save downloadable development builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sigillum-dnssec-snapshot
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14
