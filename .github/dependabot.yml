# Dependency maintenance covers Go modules and toolchains, pinned GitHub Actions,
# third-party notices, and package verification.
# Keep alerts and scheduled security scans enabled. Automatic security-update
# PRs are disabled separately in the repository settings.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: gomod
    directory: /signer
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      go-dependencies:
        patterns: ['*']
  - package-ecosystem: gomod
    directory: /validator
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      go-dependencies:
        patterns: ['*']
