version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: gomod
    directory: /signer
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      go-dependencies:
        patterns: ['*']
  - package-ecosystem: gomod
    directory: /validator
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      go-dependencies:
        patterns: ['*']
