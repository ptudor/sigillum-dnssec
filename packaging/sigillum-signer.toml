# Installed as /etc/sigillum-signer/config.toml. No zones are enrolled by default.
# Read docs/linux-packages.md before connecting this signer to NSD or BIND.
output_dir = "/var/lib/sigillum-signer/signed"
data_dir = "/var/lib/sigillum-signer"
poll_interval = "5m"

[dnssec]
algorithm = "ED25519"
ksk_lifetime = "5y"
zsk_lifetime = "90d"
# Validity is bounded to 1h–366d; the refresh window must be at least 1m and
# at least twice poll_interval so an unchanged zone is re-signed before its
# signatures expire, with room for a full signing pass.
signature_validity = "14d"
signature_refresh = "3d"
nsec_version = "nsec3"
nsec3_iterations = 0
nsec3_salt = ""
serial_policy = "keep"
# Choose publication and serial policies for your nameserver topology.
# Add a post_sign hook only after arranging its exact permissions.

[web]
enabled = true
listen = "127.0.0.1:8053"

[heartbeat]
enabled = false

[zones]
# [zones."example.invalid"]
# path = "/etc/sigillum-signer/zones/example.invalid.zone"
