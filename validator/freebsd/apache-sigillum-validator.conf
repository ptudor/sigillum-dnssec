# Apache include file for DNSSEC Validator
# Include this in your VirtualHost for www.any53.com and internet.any53.com
#
# Usage: Include /usr/local/etc/apache24/Includes/sigillum-validator.conf
#
# Requires: mod_proxy, mod_proxy_http, mod_headers
#
# LoadModule proxy_module libexec/apache24/mod_proxy.so
# LoadModule proxy_http_module libexec/apache24/mod_proxy_http.so
# LoadModule headers_module libexec/apache24/mod_headers.so

# DNSSEC Validator backend
<Proxy balancer://sigillum-validator>
    BalancerMember http://127.0.0.1:8791
</Proxy>

# SSE validation endpoint (streaming)
<Location /dnssec/validate>
    ProxyPass balancer://sigillum-validator/validate
    ProxyPassReverse balancer://sigillum-validator/validate

    # SSE requires these settings
    ProxyTimeout 300
    SetEnv proxy-sendcl 1

    # Disable buffering for SSE streaming
    SetEnv proxy-nokeepalive 1
    SetEnv proxy-initial-not-pooled 1

    # Disable output buffering
    SetEnv no-gzip 1
    Header set Cache-Control "no-cache, no-store, must-revalidate"
    Header set X-Accel-Buffering "no"
</Location>

# JSON API endpoint
<Location /dnssec/api/validate>
    ProxyPass balancer://sigillum-validator/api/validate
    ProxyPassReverse balancer://sigillum-validator/api/validate
</Location>

# Trust anchors endpoint
<Location /dnssec/api/anchors>
    ProxyPass balancer://sigillum-validator/api/anchors
    ProxyPassReverse balancer://sigillum-validator/api/anchors
</Location>

# Health check
<Location /dnssec/health>
    ProxyPass balancer://sigillum-validator/health
    ProxyPassReverse balancer://sigillum-validator/health
</Location>

# Metrics (Prometheus)
<Location /dnssec/metrics>
    ProxyPass balancer://sigillum-validator/metrics
    ProxyPassReverse balancer://sigillum-validator/metrics
</Location>

# Static files (web UI)
<Location /dnssec/>
    ProxyPass balancer://sigillum-validator/
    ProxyPassReverse balancer://sigillum-validator/
</Location>
