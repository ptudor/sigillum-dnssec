# Build with GoReleaser OSS v2.18.1; no paid features. Packages and checksums.txt
# are signed with the key at RELEASE_GPG_KEY_FILE, unlocked by NFPM_PASSPHRASE:
# the release key in the release workflow, a throwaway from scripts/snapshot.sh
# otherwise. rpmpack writes RSA signature tags only, so the key must be RSA.
version: 2
project_name: sigillum-dnssec
env:
  - CGO_ENABLED=0
builds:
  - id: signer
    binary: sigillum-signer
    dir: signer
    main: .
    goos: [linux, freebsd, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w -X main.Version={{ .Version }} -X main.BuildTime={{ .CommitDate }}
  - id: validator
    binary: sigillum-validator
    dir: validator
    main: .
    goos: [linux, freebsd, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w -X main.Version={{ .Version }} -X main.BuildTime={{ .CommitDate }}
archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - SECURITY.md
      - docs/*
      - packaging/*.toml
      - signer/sigillum-signer.rc.d
      - signer/README.md
      - signer/QUICKSTART.md
      - validator/freebsd/*
      - validator/config.toml.example
      - validator/README.md
nfpms:
  - id: signer
    package_name: sigillum-signer
    ids: [signer]
    file_name_template: '{{ .ConventionalFileName }}'
    homepage: https://github.com/ptudor/sigillum-dnssec
    maintainer: Patrick Tudor <ptudor@ptudor.net>
    description: DNSSEC zone signing and key lifecycle management.
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    section: net
    priority: optional
    mtime: '{{ .CommitDate }}'
    rpm:
      signature:
        key_file: '{{ .Env.RELEASE_GPG_KEY_FILE }}'
    deb:
      signature:
        key_file: '{{ .Env.RELEASE_GPG_KEY_FILE }}'
        type: origin
    overrides:
      deb:
        dependencies: [ca-certificates, systemd, passwd]
      rpm:
        dependencies: [ca-certificates, systemd, shadow-utils]
    contents:
      - src: packaging/sigillum-signer.toml
        dst: /etc/sigillum-signer/config.toml
        type: config|noreplace
        file_info:
          mode: 0640
      - src: packaging/sigillum-signer.service
        dst: /usr/lib/systemd/system/sigillum-signer.service
      - src: README.md
        dst: /usr/share/doc/sigillum-signer/README.md
      - src: docs/linux-packages.md
        dst: /usr/share/doc/sigillum-signer/linux-packages.md
      # Debian slim retains copyright while excluding other documentation.
      - src: THIRD_PARTY_NOTICES.md
        dst: /usr/share/doc/sigillum-signer/copyright
    scripts:
      preinstall: packaging/sigillum-signer-preinstall.sh
      postinstall: packaging/sigillum-signer-postinstall.sh
      preremove: packaging/sigillum-signer-preremove.sh
      postremove: packaging/postremove.sh
  - id: validator
    package_name: sigillum-validator
    ids: [validator]
    file_name_template: '{{ .ConventionalFileName }}'
    homepage: https://github.com/ptudor/sigillum-dnssec
    maintainer: Patrick Tudor <ptudor@ptudor.net>
    description: Streaming DNSSEC validation and troubleshooting in the browser.
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    section: net
    priority: optional
    mtime: '{{ .CommitDate }}'
    rpm:
      signature:
        key_file: '{{ .Env.RELEASE_GPG_KEY_FILE }}'
    deb:
      signature:
        key_file: '{{ .Env.RELEASE_GPG_KEY_FILE }}'
        type: origin
    overrides:
      deb:
        dependencies: [ca-certificates, systemd, passwd]
      rpm:
        dependencies: [ca-certificates, systemd, shadow-utils]
    contents:
      - src: packaging/sigillum-validator.toml
        dst: /etc/sigillum-validator/config.toml
        type: config|noreplace
        file_info:
          mode: 0640
      - src: packaging/sigillum-validator.service
        dst: /usr/lib/systemd/system/sigillum-validator.service
      - src: README.md
        dst: /usr/share/doc/sigillum-validator/README.md
      - src: docs/linux-packages.md
        dst: /usr/share/doc/sigillum-validator/linux-packages.md
      # Debian slim retains copyright while excluding other documentation.
      - src: THIRD_PARTY_NOTICES.md
        dst: /usr/share/doc/sigillum-validator/copyright
    scripts:
      preinstall: packaging/sigillum-validator-preinstall.sh
      postinstall: packaging/sigillum-validator-postinstall.sh
      preremove: packaging/sigillum-validator-preremove.sh
      postremove: packaging/postremove.sh
checksum:
  name_template: checksums.txt
  algorithm: sha256
signs:
  - artifacts: checksum
    cmd: gpg
    stdin: '{{ .Env.NFPM_PASSPHRASE }}'
    args:
      - --batch
      - --pinentry-mode=loopback
      - --passphrase-fd=0
      - --local-user={{ .Env.RELEASE_GPG_FINGERPRINT }}
      - --output=${signature}
      - --detach-sign
      - ${artifact}
changelog:
  sort: asc
  filters:
    exclude: ['^chore:', '^ci:', '^docs:']
release:
  github:
    owner: ptudor
    name: sigillum-dnssec
  draft: true
  prerelease: auto
  header: |
    Static Go binaries for the platforms named in each archive.
    Linux RPM and DEB packages are signed and install without starting services.
    See the README and docs/linux-packages.md before enabling a daemon.
    Signing key 8C4F 58EF B945 4902 267D 9B3E 426C 4AA2 1A40 0728 also signs
    checksums.txt; docs/releases.md covers signature and build attestation checks.
